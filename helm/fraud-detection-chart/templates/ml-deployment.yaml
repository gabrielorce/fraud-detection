# In this case:
# We add a Readiness Probe. If not, Kubernetes will send traffic from the frontend-ui
# to ml-service as soon as the container boots up. If scikit-learn takes a few seconds
# to load fraud_model.pkl into memory, early requests will crash with 500 Internal Server Error

# We also use an initContainer
# While downloading pandas and scikit-learn via pip install inside the initContainer works,
# it slows down pod startup times significantly (downloading ~150MB of packages on every pod restart).
# Better Approach: Use a pre-built data science image for the initContainer instead
# of downloading packages dynamically:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-fraud-service
spec:
  replicas: {{ .Values.mlService.replicaCount }}
  selector:
    matchLabels:
      app: ml-fraud-service
  template:
    metadata:
      labels:
        app: ml-fraud-service
    spec:
      initContainers:
        - name: model-trainer
          image: python:3.11-slim      
          # another version has this entry:
          # image: {{ .Values.mlService.trainerImage | default "python:3.11-slim" }}
          # BUT trainerImage would have to be configured in values.yaml
          imagePullPolicy: IfNotPresent  # <-- Forces K8s to use local image first
          command: ["/bin/sh", "-c"]
          args:
            - |
                echo "=== Starting Model Training Init Step ==="
                pip install --no-cache-dir pandas scikit-learn joblib numpy
                python /scripts/train_model.py
                echo "=== Model Training Complete! File written to PVC. ==="
          env:
            - name: MODEL_OUTPUT_DIR
              value: "/mnt/data"
          volumeMounts:
            - name: ml-data-volume
              mountPath: /mnt/data
            - name: training-script-volume
              mountPath: /scripts

      containers:
        - name: ml-api
          image: {{ .Values.mlService.image }}
          imagePullPolicy: IfNotPresent  # <-- Forces K8s to use local image first
          ports:
            - containerPort: {{ .Values.mlService.port }}
          env:
            - name: MODEL_PATH
              value: "/mnt/data/fraud_model.pkl"
          readinessProbe:
            httpGet:
              path: /docs    # FastAPI serves swagger docs here natively
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: ml-data-volume
              mountPath: /mnt/data

      volumes:
        - name: ml-data-volume
          persistentVolumeClaim:
            claimName: ml-data-pvc
        - name: training-script-volume
          configMap:
            name: ml-training-script
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: ml-fraud-service
