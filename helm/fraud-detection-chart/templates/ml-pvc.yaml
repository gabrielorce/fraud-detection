# Your dataset and .pkl model file live on a PersistentVolumeClaim (PVC). 
# On AWS, this translates directly to an EBS or EFS volume so training data
# is never baked into the container image.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mlService.modelStorageSize }}
